# Weekly, grouped, so a dependency bump is one pull request to review rather than ten.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps):'
  - package-ecosystem: cargo
    directory: /native/noise
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps):'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci):'
